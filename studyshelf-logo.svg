<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1320"></stop>
      <stop offset="100%" style="stop-color:#1a2035"></stop>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5c842"></stop>
      <stop offset="100%" style="stop-color:#e07b39"></stop>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f5c842"></stop>
      <stop offset="100%" style="stop-color:#e07b39"></stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"></feGaussianBlur>
      <feMerge><feMergeNode in="coloredBlur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
  </defs>

  
  <rect x="0" y="0" width="400" height="400" fill="url(#bg)"></rect>

  
  <circle cx="200" cy="165" r="90" fill="#f5c842" opacity="0.05"></circle>

  
  <rect x="90" y="200" width="220" height="34" rx="7" fill="#1e2a4a"></rect>
  <rect x="90" y="200" width="20" height="34" rx="5" fill="url(#gold)"></rect>
  <rect x="90" y="200" width="220" height="34" rx="7" fill="none" stroke="#f5c842" stroke-width="1" opacity="0.25"></rect>

  
  <rect x="105" y="160" width="190" height="34" rx="7" fill="#162240"></rect>
  <rect x="105" y="160" width="20" height="34" rx="5" fill="#e07b39"></rect>
  <rect x="105" y="160" width="190" height="34" rx="7" fill="none" stroke="#e07b39" stroke-width="1" opacity="0.25"></rect>

  
  <rect x="120" y="120" width="160" height="34" rx="7" fill="#0f1a33"></rect>
  <rect x="120" y="120" width="20" height="34" rx="5" fill="url(#gold)" filter="url(#glow)"></rect>
  <rect x="120" y="120" width="160" height="34" rx="7" fill="none" stroke="#f5c842" stroke-width="1.5" opacity="0.4"></rect>

  
  <g filter="url(#glow)">
    <line x1="78" y1="100" x2="78" y2="116" stroke="#f5c842" stroke-width="2.5" stroke-linecap="round"></line>
    <line x1="70" y1="108" x2="86" y2="108" stroke="#f5c842" stroke-width="2.5" stroke-linecap="round"></line>
    <line x1="72" y1="102" x2="84" y2="114" stroke="#f5c842" stroke-width="1.5" stroke-linecap="round" opacity="0.5"></line>
    <line x1="84" y1="102" x2="72" y2="114" stroke="#f5c842" stroke-width="1.5" stroke-linecap="round" opacity="0.5"></line>
  </g>

  
  <g filter="url(#glow)" opacity="0.8">
    <line x1="322" y1="112" x2="322" y2="122" stroke="#e07b39" stroke-width="2" stroke-linecap="round"></line>
    <line x1="317" y1="117" x2="327" y2="117" stroke="#e07b39" stroke-width="2" stroke-linecap="round"></line>
  </g>

  
  <circle cx="312" cy="96" r="3" fill="#f5c842" opacity="0.6"></circle>
  <circle cx="335" cy="140" r="2" fill="#e07b39" opacity="0.5"></circle>
  <circle cx="88" cy="140" r="2" fill="#e07b39" opacity="0.4"></circle>

  
  <line x1="110" y1="252" x2="290" y2="252" stroke="url(#gold)" stroke-width="1.5" opacity="0.35" stroke-linecap="round"></line>

  
  <text x="200" y="295" font-family="Georgia, serif" font-size="38" font-weight="900" font-style="italic" text-anchor="middle" fill="url(#goldText)" letter-spacing="-1">StudyShelf</text>
  <text x="200" y="330" font-family="Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#6b7590" letter-spacing="4">FREE STUDY BOOKS</text>

  
  <rect x="2" y="2" width="396" height="396" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.15"></rect>
</svg>
